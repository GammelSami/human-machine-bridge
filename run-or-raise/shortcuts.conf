# Run or Raise (GNOME Shell extension run-or-raise@edvard.cz)
# Docs: https://github.com/CZ-NIC/run-or-raise
# Symlinked to ~/.config/run-or-raise/shortcuts.conf by install.sh.
# Syntax: shortcut[:mode],command,[wm_class],[title]
# Default: launch if not running, raise if not focused, cycle windows if focused.

# Super+S: YouTube Music; when already focused, switch back to the previous window
<Super>s:switch-back-when-focused,youtube-music,com.github.th-ch.youtube-music,

# Super+T: T3 Code (window class is "t3code" or "com.t3tools.T3Code" → regex)
<Super>t,t3code,/[Tt]3[Cc]ode/,

# F19 (Corsair G-key via ckb-next): Files (Nautilus)
F19,nautilus --new-window,org.gnome.Nautilus,
