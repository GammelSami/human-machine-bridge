# keymapper – keys, mouse buttons and shortcuts → actions
# Docs: https://github.com/houmain/keymapper
# Symlinked to ~/.config/keymapper.conf by install.sh.
# Changes are reloaded automatically while `keymapper` is running.
#
# Mappings are matched top to bottom, first match wins – so context blocks
# with overrides come before the [default] block.
#
# Actions on mouse buttons go through scripts/debounce: keymapper grabs the
# mouse before libinput, so switch bounce would otherwise trigger them twice.

# ---------------------------------------------------------------- Minecraft
# Window detection needs the GNOME extension keymapper@houmain.github.com or,
# on KDE Plasma, the bundled KWin script "keymapper".
[class = /minecraft/i]

# Mouse button 4: toggle first person ↔ third person (back view).
ButtonBack >> $($HOME/Git/human-machine-bridge/scripts/debounce minecraft-perspective 300 $HOME/Git/human-machine-bridge/scripts/minecraft-perspective) ^

# ---------------------------------------------------------------- work mouse
# ROCCAT Kone XTD only (other mice keep the [default] mapping): its back
# button starts Handy like the forward button at home, forward acts as back.
[device = "ROCCAT ROCCAT Kone XTD"]
ButtonBack >> $($HOME/Git/human-machine-bridge/scripts/debounce handy 400 $HOME/Git/human-machine-bridge/scripts/handy-teamspeak) ^
ButtonForward >> ButtonBack

# ---------------------------------------------------------------- GNOME
[getenv["XDG_CURRENT_DESKTOP"] = "GNOME"]

# Run or Raise keys (see run-or-raise/shortcuts.conf): send a short tap only.
# Holding the key would make GNOME auto-repeat it, Run or Raise would cycle
# windows 30× per second and GNOME Shell (and the mouse pointer) would stall.
F19 >> F19 ^
Meta{T} >> Meta{T} ^

# App launchers (moved here from GNOME custom shortcuts)
Meta{Enter} >> $(kgx) ^                                    # new terminal window
Meta{Period} >> $(flatpak run it.mijorus.smile) ^          # emoji picker
(Shift Control){Escape} >> $(missioncenter) ^              # task manager

# ---------------------------------------------------------------- KDE Plasma
# Same keys as the GNOME block and run-or-raise/shortcuts.conf, with KDE apps.
# Meta+. stays with KDE's own emoji picker.
[getenv["XDG_CURRENT_DESKTOP"] = "KDE"]

Meta{S} >> $($HOME/Git/human-machine-bridge/scripts/run-or-raise youtube-music youtube-music) ^
Meta{T} >> $($HOME/Git/human-machine-bridge/scripts/run-or-raise t3code t3code) ^
F19 >> $($HOME/Git/human-machine-bridge/scripts/run-or-raise dolphin dolphin --new-window) ^
Meta{Enter} >> $(konsole) ^                                # new terminal window
(Shift Control){Escape} >> $(plasma-systemmonitor) ^       # task manager

# ---------------------------------------------------------------- everywhere
[default]

# TeamSpeak 6 Remote Apps and TeamSpeak 3 ClientQuery actions. These raw
# Corsair G-key codes are visible to keymapper even though GNOME/XKB translates
# F14-F16 to XF86 keysyms.
F14 >> $($HOME/Git/human-machine-bridge/scripts/teamspeak-action mic) ^
F15 >> $($HOME/Git/human-machine-bridge/scripts/teamspeak-action sound) ^
F16 >> $($HOME/Git/human-machine-bridge/scripts/teamspeak-action afk) ^

# Handy dictation on mouse button 5 (forward), toggle mode:
# first click starts recording and mutes TeamSpeak's capture stream;
# next click stops recording and restores TeamSpeak's previous capture mute.
# For push-to-talk instead (press starts, release stops), map both halves:
# ButtonForward >> $(…handy --toggle-transcription) ^ $(…handy --toggle-transcription)
ButtonForward >> $($HOME/Git/human-machine-bridge/scripts/debounce handy 400 $HOME/Git/human-machine-bridge/scripts/handy-teamspeak) ^
Control{Space} >> $($HOME/Git/human-machine-bridge/scripts/handy-teamspeak) ^

(Shift Meta){Q} >> $($HOME/Git/human-machine-bridge/scripts/clipboard-qr) ^

# Characters (ported from the old AHK setup). For reference, native in the
# German layout: AltGr+. → …, AltGr+- → –, Shift+AltGr+- → —.
# Characters missing from the layout (≈) are typed via Ctrl+Shift+U hex input,
# which works in GTK/IBus apps but not everywhere.
AltRight{X} >> "×"
# AltGr++ → ≈, Shift+AltGr++ → ~ (swapped with the layout's native AltGr++ → ~).
# The + key is BracketRight; the Shift variant must come first.
(Shift AltRight){BracketRight} >> "~"
AltRight{BracketRight} >> "≈"
Shift{NumpadDecimal} >> ":"
Control{NumpadDecimal} >> "."
