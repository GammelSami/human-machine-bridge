# espanso match file

# For a complete introduction, visit the official docs at: https://espanso.org/docs/

# You can use this file to define the base matches (aka snippets)
# that will be available in every application when using espanso.

# Matches are substitution rules: when you type the "trigger" string
# it gets replaced by the "replace" string.

# yaml-language-server: $schema=https://raw.githubusercontent.com/espanso/espanso/dev/schemas/match.schema.json

matches:
  # Simple text replacement
  - trigger: ":skull"
    replace: "💀"
    force_clipboard: true
  # Emojis (ported from the old AHK setup). Colon prefix instead of word
  # triggers: word triggers don't fire right after an emoji or another expansion.
  - trigger: ":tear"
    replace: "🥲"
    force_clipboard: true
  - trigger: ":sob"
    replace: "😭"
    force_clipboard: true
  - trigger: " ema "
    replace: " E-Mail-Adresse "
  - trigger: " email "
    replace: " E-Mail "

  - trigger: ":support"
    replace: "https://mdl.hs-duesseldorf.de/support"

  - trigger: " zb "
    replace: " z. B. "

  - trigger: ":dat"
    replace: "{{d}}"
    vars:
      - name: d
        type: date
        params:
          format: "%d.%m.%Y"

  - trigger: ":datlang"
    replace: "{{d}}"
    vars:
      - name: d
        type: date
        params:
          format: "%-d. %B %Y"
          locale: "de_DE"

  - trigger: ":mfg"
    replace: |-
      Mit freundlichen Grüßen
      Samuel Lang

  - trigger: ":details"
    replace: |-
      Damit ich das nachvollziehen kann, brauche ich bitte noch:
      - den Kursnamen bzw. die Kurs-ID
      - Ihren Browser (Firefox, Chrome, Edge ...)
      - wann der Fehler zuletzt aufgetreten ist
      - falls möglich einen Screenshot der Fehlermeldung

  # Print the current date
  - trigger: ":date"
    replace: "{{mydate}}"
    vars:
      - name: mydate
        type: date
        params:
          format: "%Y-%m-%d"

  # Print the output of a shell command
  - trigger: ":shell"
    replace: "{{output}}"
    vars:
      - name: output
        type: shell
        params:
          cmd: "echo 'Hello from your shell'"

  # And much more! For more information, visit the docs: https://espanso.org/docs/
